version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: extrator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrator_db
      POSTGRES_USER: extrator_user
      POSTGRES_PASSWORD: extrator_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extrator_user -d extrator_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: extrator_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.docker
      - DEBUG=True
      - SECRET_KEY=63f4945d921d599f27ae4fdf5bada3f1
      - DATABASE_ENGINE=postgresql
      - DATABASE_NAME=extrator_db
      - DATABASE_USER=extrator_user
      - DATABASE_PASSWORD=extrator_password_2024
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
