services:
  # Backend Django
  - type: web
    name: extrator-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings.production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: http://localhost:5173

databases:
  # PostgreSQL Database
  - name: extrator-db
    plan: free
    databaseName: extrator_db
    user: extrator_user
